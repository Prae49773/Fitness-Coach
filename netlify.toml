[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NEON_DB = "postgresql://neondb_owner:npg_MbWTa23JFAHE@ep-quiet-resonance-aos5g854-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
